version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      android-build:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    groups:
      artwork-tools:
        patterns: ['*']
    open-pull-requests-limit: 3
