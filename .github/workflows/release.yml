name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v1.4.0)
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Validate, sign and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check release tag matches Android version
        run: |
          python3 - <<'PYCODE'
          import os,re
          from pathlib import Path
          version=re.search(r'versionName = "([^"]+)"',Path('watchface/build.gradle.kts').read_text())[1]
          assert os.environ['RELEASE_TAG']=='v'+version, 'Tag and Android versionName must match'
          PYCODE
      - name: Validate source and debug package
        run: tools/validate.sh
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLD_TICK_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import os,base64
          from pathlib import Path
          data=os.environ['KEYSTORE_BASE64']
          assert data, 'Configure the FOLD_TICK signing secrets before releasing'
          path=Path(os.environ['RUNNER_TEMP'])/'fold-and-tick.jks'
          path.write_bytes(base64.b64decode(data,validate=True))
          path.chmod(0o600)
          PYCODE
      - name: Build and verify signed APK
        env:
          FOLD_TICK_KEYSTORE_PATH: ${{ runner.temp }}/fold-and-tick.jks
          FOLD_TICK_STORE_PASSWORD: ${{ secrets.FOLD_TICK_STORE_PASSWORD }}
          FOLD_TICK_KEY_ALIAS: ${{ secrets.FOLD_TICK_KEY_ALIAS }}
          FOLD_TICK_KEY_PASSWORD: ${{ secrets.FOLD_TICK_KEY_PASSWORD }}
        run: tools/package_release.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published APKs.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/Fold-and-Tick.apk dist/SHA256SUMS dist/SIGNING-CERTIFICATE.txt --verify-tag --title "Fold & Tick ${RELEASE_TAG#v}" --generate-notes
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fold-and-tick.jks"
